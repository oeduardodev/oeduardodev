<text x="62" y="535" font-family="Arial, sans-serif" font-size="16px" font-weight="400" fill="#f5f5f5" text-anchor="start">Sou Eduardo Leite, desenvolvedor Front-end com 4 anos de experiência no desenvolvimento de aplicações web, SPAs, dashboards,</text>
<text x="62" y="560" font-family="Arial, sans-serif" font-size="16px" font-weight="400" fill="#f5f5f5" text-anchor="start">ERPs e sistemas corporativos.</text>
<text x="62" y="599" font-family="Arial, sans-serif" font-size="16px" font-weight="400" fill="#f5f5f5" text-anchor="start">Minha principal atuação é com Angular, React e TypeScript, desde a criação de interfaces responsivas e componentes reutilizáveis</text>
<text x="62" y="624" font-family="Arial, sans-serif" font-size="16px" font-weight="400" fill="#f5f5f5" text-anchor="start">até a integração com APIs REST e o gerenciamento de estado. Também tenho conhecimentos em Node.js, Express, AdonisJS e</text>
<text x="62" y="649" font-family="Arial, sans-serif" font-size="16px" font-weight="400" fill="#f5f5f5" text-anchor="start">PostgreSQL, que ampliam minha visão sobre o funcionamento das aplicações de ponta a ponta.</text>
<text x="62" y="688" font-family="Arial, sans-serif" font-size="16px" font-weight="400" fill="#f5f5f5" text-anchor="start">No dia a dia, valorizo código bem estruturado, acessibilidade, manutenibilidade, testes e colaboração com o time.</text>
