name: Atualizar gráficos do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
  push:
    paths:
      - 'README.md'
      - 'scripts/render_github_stats.py'
      - '.github/workflows/refresh-profile-stats.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar dados públicos e gerar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: oeduardodev
        run: python scripts/render_github_stats.py
      - name: Publicar os gráficos no próprio repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-overview.svg assets/github-languages.svg assets/github-activity.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar gráficos do perfil [skip ci]'
            git push
          fi
